<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ffffff;
  --bg-subtle: #f8f9fa;
  --bg-hover: #f1f3f5;
  --bg-active: #e9ecef;
  --surface: #ffffff;
  --border: #dee2e6;
  --border-light: #f1f3f5;
  --text: #212529;
  --text-secondary: #6c757d;
  --text-tertiary: #adb5bd;
  --accent: #228be6;
  --accent-light: #e7f5ff;
  --accent-hover: #1c7ed6;
  --green: #2f9e44;
  --green-light: #ebfbee;
  --amber: #e8590c;
  --amber-light: #fff4e6;
  --red: #e03131;
  --red-light: #fff5f5;
  --purple: #7950f2;
  --purple-light: #f3f0ff;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.07);
  --shadow-lg: 0 8px 30px rgba(0,0,0,0.1);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --transition: 0.15s ease;
  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', 'Consolas', monospace;
}

html, body {
  height: 100%;
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.6;
  background: var(--bg-subtle);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ── */
.layout { display: flex; height: 100vh; }

/* ── Sidebar ── */
.sidebar {
  width: 260px; min-width: 260px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.sidebar-header {
  padding: 16px; border-bottom: 1px solid var(--border-light);
  display: flex; align-items: center; justify-content: space-between;
}
.sidebar-brand { display: flex; align-items: center; gap: 8px; }
.sidebar-logo {
  width: 28px; height: 28px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff;
}
.sidebar-title { font-size: 14px; font-weight: 600; }
.btn-new-chat {
  width: 30px; height: 30px;
  background: var(--bg-subtle); border: 1px solid var(--border);
  border-radius: var(--radius-sm); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--text-secondary);
  transition: var(--transition);
}
.btn-new-chat:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

.conv-list { flex: 1; overflow-y: auto; padding: 8px; }
.conv-list::-webkit-scrollbar { width: 4px; }
.conv-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.conv-item {
  padding: 10px 12px; border-radius: var(--radius-sm);
  cursor: pointer; transition: var(--transition);
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 2px;
}
.conv-item:hover { background: var(--bg-hover); }
.conv-item.active { background: var(--accent-light); }
.conv-item .conv-title {
  font-size: 13px; font-weight: 500; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  flex: 1;
}
.conv-item .conv-time {
  font-size: 11px; color: var(--text-tertiary);
  white-space: nowrap; margin-left: 8px;
}
.conv-item .conv-delete {
  display: none; background: none; border: none;
  color: var(--text-tertiary); cursor: pointer; font-size: 14px;
  padding: 2px 4px; border-radius: 4px;
  transition: var(--transition);
}
.conv-item:hover .conv-delete { display: block; }
.conv-item .conv-delete:hover { color: var(--red); background: var(--red-light); }

.sidebar-section-label {
  font-size: 11px; font-weight: 600; color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: 0.5px;
  padding: 12px 12px 6px;
}

.sidebar-footer {
  padding: 12px 16px; border-top: 1px solid var(--border-light);
}
.sidebar-footer .workspace-info {
  font-size: 12px; color: var(--text-tertiary);
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 8px;
}
.sidebar-footer .workspace-info .ws-path {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--font-mono); font-size: 11px;
}
.sidebar-footer-actions { display: flex; gap: 6px; }
.sidebar-footer-btn {
  flex: 1; padding: 6px 0; background: var(--bg-subtle);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: 12px; color: var(--text-secondary);
  cursor: pointer; transition: var(--transition);
  font-family: var(--font-ui); text-align: center;
}
.sidebar-footer-btn:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

/* ── Main ── */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px;
  border-bottom: 1px solid var(--border-light);
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 10;
}
.header-center {
  font-size: 14px; font-weight: 600; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  max-width: 300px;
}
.header-actions { display: flex; gap: 4px; align-items: center; }
.header-model {
  font-size: 11px; color: var(--text-tertiary);
  font-family: var(--font-mono);
  background: var(--bg-subtle); padding: 3px 8px;
  border-radius: 4px; border: 1px solid var(--border-light);
}
.btn-icon {
  width: 32px; height: 32px;
  background: none; border: 1px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: var(--transition); font-size: 16px;
}
.btn-icon:hover { background: var(--bg-hover); color: var(--text); border-color: var(--border); }

/* ── Messages ── */
.messages { flex: 1; overflow-y: auto; padding: 20px 20px 8px; }
.messages::-webkit-scrollbar { width: 5px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

.msg { margin-bottom: 16px; animation: msgIn 0.25s ease; }
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } }

.msg.user { display: flex; justify-content: flex-end; }
.msg.user .msg-bubble {
  background: var(--accent); color: #fff;
  border-radius: var(--radius-lg) var(--radius-lg) 4px var(--radius-lg);
  padding: 10px 14px; max-width: 75%;
  font-size: 14px; line-height: 1.55;
  white-space: pre-wrap; word-break: break-word;
}

.msg.assistant { display: flex; flex-direction: column; align-items: flex-start; }
.msg.assistant .msg-body {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 4px;
  padding: 14px 16px;
  max-width: 100%; font-size: 14px; line-height: 1.7;
  white-space: pre-wrap; word-break: break-word;
}

.msg-body p { margin-bottom: 10px; }
.msg-body p:last-child { margin-bottom: 0; }
.msg-body strong { font-weight: 600; }
.msg-body em { color: var(--text-secondary); }
.msg-body ul, .msg-body ol { padding-left: 18px; margin-bottom: 10px; }
.msg-body li { margin-bottom: 3px; }
.msg-body blockquote {
  border-left: 3px solid var(--accent);
  padding-left: 12px; color: var(--text-secondary);
  margin: 10px 0; font-style: italic;
}
.msg-body h1, .msg-body h2, .msg-body h3 { font-weight: 600; margin: 14px 0 6px; }
.msg-body h1 { font-size: 18px; } .msg-body h2 { font-size: 16px; } .msg-body h3 { font-size: 15px; }
.msg-body a { color: var(--accent); text-decoration: none; }
.msg-body a:hover { text-decoration: underline; }
.msg-body hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

.msg-body pre {
  background: var(--bg-subtle); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px 16px;
  overflow-x: auto; margin: 10px 0; position: relative;
}
.msg-body pre code {
  font-family: var(--font-mono); font-size: 12.5px; line-height: 1.6; color: #212529;
}
.msg-body code:not(pre code) {
  background: var(--accent-light); padding: 1px 5px; border-radius: 4px;
  font-family: var(--font-mono); font-size: 12.5px; color: var(--accent);
}
.code-copy {
  position: absolute; top: 8px; right: 8px;
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text-tertiary); padding: 3px 8px; border-radius: 6px;
  cursor: pointer; font-family: var(--font-mono); font-size: 11px;
  opacity: 0; transition: var(--transition);
}
pre:hover .code-copy { opacity: 1; }
.code-copy:hover { color: var(--text); border-color: var(--text-tertiary); }

/* ── Tool Cards ── */
.tool-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md); margin: 8px 0;
  overflow: hidden; animation: toolIn 0.25s ease;
  box-shadow: var(--shadow-sm);
}
@keyframes toolIn { from { opacity: 0; transform: translateY(4px); } }

.tool-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px; cursor: pointer; user-select: none;
  transition: var(--transition);
}
.tool-header:hover { background: var(--bg-hover); }

.tool-badge {
  font-size: 11px; font-weight: 600; padding: 2px 8px;
  border-radius: 980px; letter-spacing: 0.2px;
}
.tool-badge.read { background: #e7f5ff; color: #1971c2; }
.tool-badge.write { background: #ebfbee; color: #2b8a3e; }
.tool-badge.list { background: #f3f0ff; color: #7048e8; }
.tool-badge.run { background: #fff4e6; color: #e8590c; }
.tool-badge.search { background: #e3fafc; color: #0c8599; }

.tool-name { font-size: 13px; font-weight: 500; color: var(--text); }
.tool-arrow {
  margin-left: auto; font-size: 11px; color: var(--text-tertiary);
  transition: transform 0.2s ease;
}
.tool-card.open .tool-arrow { transform: rotate(180deg); }

.tool-status {
  margin-left: auto; font-size: 11px; font-weight: 500;
  display: flex; align-items: center; gap: 4px;
}
.tool-status.running { color: var(--amber); }
.tool-status.done { color: var(--green); }
.tool-status .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; animation: blink 1.2s ease infinite;
}
@keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

.tool-detail {
  max-height: 0; overflow: hidden;
  transition: max-height 0.3s ease;
  border-top: 0 solid var(--border-light);
}
.tool-card.open .tool-detail {
  max-height: 500px; overflow-y: auto;
  border-top-width: 1px;
}
.tool-detail pre {
  margin: 0; border: none; border-radius: 0;
  padding: 12px 14px; font-size: 12px; line-height: 1.5;
  background: var(--bg-subtle);
}
.tool-detail pre code { font-size: 12px; color: #495057; }
.tool-input-line {
  padding: 8px 14px; font-size: 12px;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border-light);
}
.tool-input-line code { color: var(--accent); font-family: var(--font-mono); font-size: 12px; }

.typing-dots { display: flex; gap: 4px; padding: 4px 0; }
.typing-dots span {
  width: 5px; height: 5px; background: var(--text-tertiary);
  border-radius: 50%; animation: pulse 1.4s ease infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.15s; }
.typing-dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes pulse { 0%, 60%, 100% { opacity: 0.25; } 30% { opacity: 1; } }

.msg-error {
  color: var(--red); font-size: 13px; padding: 10px 14px;
  background: var(--red-light); border: 1px solid #ffc9c9;
  border-radius: var(--radius-sm);
}

/* ── Welcome ── */
.welcome {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 40px 32px;
}
.welcome-logo {
  width: 56px; height: 56px;
  background: var(--accent);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; color: #fff; font-weight: 700;
  margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(34, 139, 230, 0.2);
}
.welcome h2 { font-size: 26px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.5px; }
.welcome p { color: var(--text-secondary); font-size: 14px; max-width: 360px; }
.welcome-chips {
  display: flex; gap: 8px; margin-top: 28px;
  flex-wrap: wrap; justify-content: center;
}
.chip {
  background: var(--surface); border: 1px solid var(--border);
  color: var(--text-secondary); padding: 8px 16px;
  border-radius: 980px; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: var(--transition); font-family: inherit;
}
.chip:hover {
  color: var(--accent); border-color: var(--accent);
  background: var(--accent-light);
  transform: translateY(-1px); box-shadow: var(--shadow-sm);
}

/* ── Input ── */
.input-area {
  padding: 12px 20px 16px;
  border-top: 1px solid var(--border-light);
  background: var(--bg);
  position: relative;
}
.input-box {
  display: flex; align-items: flex-end; gap: 8px;
  background: var(--bg-subtle);
  border: 1.5px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 6px 6px 6px 16px;
  transition: var(--transition);
}
.input-box:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(34,139,230,0.1);
  background: var(--bg);
}
#userInput {
  flex: 1; background: none; border: none; color: var(--text);
  padding: 10px 0; font-family: var(--font-ui); font-size: 14px;
  line-height: 1.5; resize: none; min-height: 42px; max-height: 180px; outline: none;
}
#userInput::placeholder { color: var(--text-tertiary); }
#sendBtn {
  width: 34px; height: 34px;
  background: var(--accent); border: none;
  border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: var(--transition); flex-shrink: 0;
}
#sendBtn:hover { background: var(--accent-hover); transform: scale(1.05); }
#sendBtn:disabled { background: var(--border); cursor: not-allowed; transform: none; }
#sendBtn svg { width: 16px; height: 16px; fill: #fff; }
.input-hint {
  font-size: 11px; color: var(--text-tertiary);
  margin-top: 6px; text-align: center;
}

/* ── Slash Dropdown ── */
.slash-dropdown {
  display: none;
  position: absolute;
  bottom: 100%; left: 20px; right: 20px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  max-height: 280px; overflow-y: auto;
  z-index: 50;
  margin-bottom: 4px;
}
.slash-dropdown.open { display: block; animation: dropdownIn 0.15s ease; }
@keyframes dropdownIn { from { opacity: 0; transform: translateY(4px); } }

.slash-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px; cursor: pointer;
  transition: var(--transition);
}
.slash-item:hover, .slash-item.active { background: var(--accent-light); }
.slash-item .slash-cmd {
  font-family: var(--font-mono); font-size: 13px; font-weight: 600;
  color: var(--accent); min-width: 120px;
}
.slash-item .slash-desc {
  font-size: 12px; color: var(--text-secondary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ── Modal ── */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.15); backdrop-filter: blur(4px);
  z-index: 100; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 28px;
  width: 480px; max-width: 90vw; max-height: 80vh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: modalIn 0.2s ease;
}
@keyframes modalIn { from { opacity: 0; transform: scale(0.97) translateY(8px); } }
.modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 20px; }
.modal label {
  display: block; font-size: 12px; font-weight: 600;
  color: var(--text-secondary); margin-bottom: 6px;
}
.modal input[type="text"], .modal input[type="password"], .modal textarea, .modal select {
  width: 100%; background: var(--bg-subtle);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  color: var(--text); padding: 10px 12px;
  font-family: var(--font-ui); font-size: 13px; line-height: 1.5;
  outline: none; margin-bottom: 16px;
  transition: var(--transition);
}
.modal input:focus, .modal textarea:focus, .modal select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(34,139,230,0.08);
}
.modal textarea { resize: vertical; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
.btn-secondary {
  background: var(--bg-subtle); border: 1px solid var(--border);
  color: var(--text-secondary); padding: 7px 16px;
  border-radius: 980px; cursor: pointer;
  font-family: var(--font-ui); font-size: 13px; font-weight: 500;
  transition: var(--transition);
}
.btn-secondary:hover { background: var(--bg-hover); color: var(--text); }
.btn-primary {
  background: var(--accent); border: none; color: #fff;
  padding: 7px 16px; border-radius: 980px; cursor: pointer;
  font-family: var(--font-ui); font-size: 13px; font-weight: 600;
  transition: var(--transition);
}
.btn-primary:hover { background: var(--accent-hover); }

/* Proxy presets */
.proxy-presets {
  display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;
}
.proxy-preset {
  padding: 5px 12px; background: var(--bg-subtle);
  border: 1px solid var(--border); border-radius: 6px;
  font-size: 12px; color: var(--text-secondary);
  cursor: pointer; transition: var(--transition);
  font-family: var(--font-mono);
}
.proxy-preset:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.proxy-preset.active { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.proxy-hint {
  font-size: 11px; color: var(--text-tertiary);
  margin: -8px 0 16px; line-height: 1.5;
}
.proxy-hint a { color: var(--accent); text-decoration: none; }

/* Status bar */
.status-bar {
  padding: 6px 20px;
  border-top: 1px solid var(--border-light);
  background: var(--bg);
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11px; color: var(--text-tertiary);
  font-family: var(--font-mono);
}
.status-left { display: flex; gap: 12px; align-items: center; }
.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--green); display: inline-block;
}
.status-right { display: flex; gap: 12px; }

/* Titlebar (Electron) */
.titlebar {
  height: 32px; -webkit-app-region: drag;
  background: transparent; position: fixed; top: 0; left: 0; right: 0; z-index: 100;
}
.titlebar-btns {
  -webkit-app-region: no-drag; display: flex; gap: 8px;
  position: absolute; right: 12px; top: 8px;
}
.titlebar-btns button { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: pointer; }
.btn-close { background: #ff5f57; } .btn-minimize { background: #febc2e; } .btn-maximize { background: #28c840; }

/* File tree */
.file-tree { padding: 4px 0; }
.file-item {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 12px; font-size: 12px;
  color: var(--text-secondary);
  cursor: pointer; transition: var(--transition);
  font-family: var(--font-mono);
}
.file-item:hover { background: var(--bg-hover); color: var(--text); }
.file-item .fi { width: 16px; text-align: center; font-size: 12px; }
.file-item.dir .fi { color: var(--accent); }
.file-item.file .fi { color: var(--text-tertiary); }

@media (max-width: 768px) {
  .sidebar { display: none; }
  .layout { flex-direction: column; }
}
</style>
</head>
<body>

<div class="titlebar" id="titlebar" style="display:none;">
  <div class="titlebar-btns">
    <button class="btn-close" id="btnClose"></button>
    <button class="btn-minimize" id="btnMinimize"></button>
    <button class="btn-maximize" id="btnMaximize"></button>
  </div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <div class="sidebar-logo">C</div>
        <span class="sidebar-title">Claude</span>
      </div>
      <button class="btn-new-chat" id="btnNewChat" title="新建对话">+</button>
    </div>

    <div class="sidebar-section-label">对话列表</div>
    <div class="conv-list" id="convList"></div>

    <div class="sidebar-section-label">工作区文件</div>
    <div class="file-tree" id="fileTree">
      <div class="file-item" style="color:var(--text-tertiary);font-style:italic;padding:8px 12px;font-family:var(--font-ui);font-size:12px;">
        请先设置工作目录
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="workspace-info">
        <span>~/</span>
        <span class="ws-path" id="workspacePath">未设置</span>
      </div>
      <div class="sidebar-footer-actions">
        <button class="sidebar-footer-btn" id="changeWorkspaceBtn">切换目录</button>
        <button class="sidebar-footer-btn" id="exportBtn">导出 .md</button>
      </div>
      <input type="file" id="workspacePicker" webkitdirectory style="display:none;" />
    </div>
  </div>

  <div class="main">
    <div class="header">
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="btn-icon" id="menuBtn" title="菜单" style="display:none;">☰</button>
        <span class="header-center" id="headerTitle">新对话</span>
      </div>
      <div class="header-actions">
        <span class="header-model" id="headerModel">sonnet-4</span>
        <button class="btn-icon" id="clearBtn" title="新对话">✦</button>
        <button class="btn-icon" id="settingsBtn" title="设置">⚙</button>
      </div>
    </div>

    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-logo">C</div>
        <h2>有什么可以帮忙的？</h2>
        <p>我可以读写文件、执行命令、搜索代码</p>
        <div class="welcome-chips">
          <button class="chip" data-prompt="/browse">浏览文件</button>
          <button class="chip" data-prompt="/read package.json">读取文件</button>
          <button class="chip" data-prompt="/run dir">执行命令</button>
          <button class="chip" data-prompt="/analyze">分析项目</button>
          <button class="chip" data-prompt="/git-status">Git 状态</button>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="slash-dropdown" id="slashDropdown"></div>
      <div class="input-box">
        <textarea id="userInput" rows="1" placeholder="输入消息，或输入 / 使用快捷命令..."></textarea>
        <button id="sendBtn" disabled>
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
      <div class="input-hint">Enter 发送 / Shift+Enter 换行 / / 呼出命令</div>
    </div>

    <div class="status-bar">
      <div class="status-left">
        <span><span class="status-dot"></span> 已连接</span>
        <span id="statusMessages">0 条消息</span>
      </div>
      <div class="status-right">
        <span id="statusTokens"></span>
        <span id="statusWorkspace">未设置工作区</span>
      </div>
    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>设置</h3>

    <label>API Key *</label>
    <input type="password" id="apiKeyInput" placeholder="sk-ant-..." />

    <label>API 代理地址</label>
    <div class="proxy-presets" id="proxyPresets">
      <span class="proxy-preset" data-url="https://api.anthropic.com">官方直连</span>
      <span class="proxy-preset" data-url="https://api.anthropic-proxy.com">代理 1</span>
      <span class="proxy-preset" data-url="https://api.openai-proxy.org">代理 2</span>
    </div>
    <input type="text" id="baseURLInput" placeholder="https://api.anthropic.com" />
    <div class="proxy-hint">
      国内网络无法直接访问 Anthropic 官方 API，请使用代理地址或自建反向代理。选择上方预设或手动填写。
    </div>

    <label>模型</label>
    <select id="modelSelect">
      <option value="claude-sonnet-4-20250514">Claude Sonnet 4</option>
      <option value="claude-opus-4-20250514">Claude Opus 4</option>
      <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5</option>
      <option value="custom">自定义模型...</option>
    </select>
    <input type="text" id="modelInput" placeholder="输入自定义模型名称" style="display:none;" />

    <label>系统提示词</label>
    <textarea id="systemPrompt" rows="4">你是 Claude，由 Anthropic 开发的 AI 助手。你可以读写文件、执行命令、搜索代码。请用用户的语言回复。</textarea>

    <div style="font-size:11px;color:var(--text-tertiary);margin:-10px 0 16px;">API Key 仅存储在浏览器本地，不会上传到任何服务器。</div>
    <div class="modal-actions">
      <button class="btn-secondary" id="modalClose">取消</button>
      <button class="btn-primary" id="modalSave">保存</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function() {
  // ── State ──
  let conversationHistory = [];
  let conversations = JSON.parse(localStorage.getItem('claude-conversations') || '[]');
  let currentConvId = null;
  let systemPrompt = localStorage.getItem('claude-system-prompt') ||
    '你是 Claude，由 Anthropic 开发的 AI 助手。你可以读写文件、执行命令、搜索代码。请用用户的语言回复。';
  let apiConfig = JSON.parse(localStorage.getItem('claude-api-config') || '{}');
  let isStreaming = false;
  let slashIndex = -1;

  const $ = id => document.getElementById(id);
  const messagesEl = $('messages'), welcomeEl = $('welcome');
  const userInput = $('userInput'), sendBtn = $('sendBtn');
  const convListEl = $('convList'), fileTreeEl = $('fileTree');
  const slashDropdown = $('slashDropdown');
  const headerTitle = $('headerTitle'), headerModel = $('headerModel');
  const statusMessages = $('statusMessages'), statusTokens = $('statusTokens'), statusWorkspace = $('statusWorkspace');
  const modelSelect = $('modelSelect'), modelInput = $('modelInput');
  const proxyPresets = $('proxyPresets'), baseURLInput = $('baseURLInput');

  // ── Slash Commands ──
  const slashCommands = [
    { cmd: '/browse', desc: '浏览工作区文件', handler: () => sendAsUser('列出当前目录下的所有文件') },
    { cmd: '/read', desc: '读取文件（如 /read package.json）', handler: (arg) => sendAsUser('读取文件 ' + (arg || 'package.json')) },
    { cmd: '/run', desc: '执行命令（如 /run npm test）', handler: (arg) => sendAsUser('执行命令: ' + (arg || 'dir')) },
    { cmd: '/search', desc: '搜索代码（如 /search function）', handler: (arg) => sendAsUser('搜索所有包含 "' + (arg || 'TODO') + '" 的文件') },
    { cmd: '/write', desc: '写入文件（如 /write hello.py）', handler: (arg) => sendAsUser('写入文件: ' + (arg || 'test.txt')) },
    { cmd: '/analyze', desc: '分析项目结构', handler: () => sendAsUser('分析这个项目的结构和依赖') },
    { cmd: '/git-status', desc: '查看 Git 状态', handler: () => sendAsUser('执行: git status') },
    { cmd: '/git-log', desc: '查看最近提交记录', handler: () => sendAsUser('执行: git log --oneline -10') },
    { cmd: '/git-diff', desc: '查看未暂存的更改', handler: () => sendAsUser('执行: git diff') },
    { cmd: '/deps', desc: '分析依赖', handler: () => sendAsUser('检查 package.json 的依赖并建议更新') },
    { cmd: '/explain', desc: '解释文件（如 /explain server.js）', handler: (arg) => sendAsUser('详细解释 ' + (arg || '这个项目') + ' 的功能') },
    { cmd: '/test', desc: '运行测试', handler: () => sendAsUser('执行: npm test') },
    { cmd: '/clear', desc: '清空对话', handler: () => { newConversation(); } },
    { cmd: '/export', desc: '导出对话为 Markdown', handler: () => exportConversation() },
    { cmd: '/help', desc: '显示所有命令', handler: () => showHelp() },
  ];

  function showSlashDropdown(filter) {
    const filtered = filter
      ? slashCommands.filter(c => c.cmd.startsWith(filter) || c.desc.includes(filter.slice(1)))
      : slashCommands;

    if (!filtered.length) { slashDropdown.classList.remove('open'); return; }

    slashDropdown.innerHTML = filtered.map((c, i) =>
      `<div class="slash-item${i===0?' active':''}" data-cmd="${c.cmd}">
        <span class="slash-cmd">${c.cmd}</span>
        <span class="slash-desc">${c.desc}</span>
      </div>`
    ).join('');
    slashDropdown.classList.add('open');
    slashIndex = 0;

    slashDropdown.querySelectorAll('.slash-item').forEach(el => {
      el.addEventListener('click', () => {
        const cmd = el.dataset.cmd;
        const sc = slashCommands.find(c => c.cmd === cmd);
        if (sc) {
          if (['/clear','/export','/help','/analyze','/git-status','/git-log','/git-diff','/deps','/test','/browse'].includes(sc.cmd)) {
            sc.handler();
          } else {
            userInput.value = cmd + ' ';
            userInput.focus();
          }
        }
        slashDropdown.classList.remove('open');
      });
    });
  }

  function hideSlashDropdown() {
    slashDropdown.classList.remove('open');
    slashIndex = -1;
  }

  function showHelp() {
    const helpText = '可用命令：\n\n' +
      slashCommands.map(c => `  ${c.cmd.padEnd(14)} ${c.desc}`).join('\n');
    appendAssistantMessage(helpText);
  }

  // ── Conversations ──
  function saveConversations() {
    localStorage.setItem('claude-conversations', JSON.stringify(conversations));
  }

  function renderConvList() {
    convListEl.innerHTML = conversations.map(c =>
      `<div class="conv-item${c.id===currentConvId?' active':''}" data-id="${c.id}">
        <span class="conv-title">${escapeHtml(c.title || '新对话')}</span>
        <span class="conv-time">${formatTime(c.updatedAt)}</span>
        <button class="conv-delete" data-id="${c.id}" title="删除">×</button>
      </div>`
    ).join('');

    convListEl.querySelectorAll('.conv-item').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.classList.contains('conv-delete')) {
          deleteConversation(e.target.dataset.id);
          return;
        }
        loadConversation(el.dataset.id);
      });
    });
  }

  function newConversation() {
    currentConvId = 'conv_' + Date.now();
    conversationHistory = [];
    conversations.unshift({
      id: currentConvId, title: '新对话',
      messages: [], createdAt: Date.now(), updatedAt: Date.now()
    });
    if (conversations.length > 50) conversations = conversations.slice(0, 50);
    saveConversations(); renderConvList();
    messagesEl.innerHTML = '';
    messagesEl.appendChild(welcomeEl);
    welcomeEl.style.display = 'flex';
    headerTitle.textContent = '新对话';
    updateStatus();
  }

  function loadConversation(id) {
    const conv = conversations.find(c => c.id === id);
    if (!conv) return;
    currentConvId = id;
    conversationHistory = conv.messages ? [...conv.messages] : [];
    headerTitle.textContent = conv.title || '新对话';
    renderConvList(); renderMessages(); updateStatus();
  }

  function deleteConversation(id) {
    conversations = conversations.filter(c => c.id !== id);
    saveConversations();
    if (currentConvId === id) {
      if (conversations.length) loadConversation(conversations[0].id);
      else newConversation();
    } else { renderConvList(); }
  }

  function updateCurrentConv(messages, title) {
    const conv = conversations.find(c => c.id === currentConvId);
    if (!conv) return;
    conv.messages = messages;
    if (title) conv.title = title;
    conv.updatedAt = Date.now();
    saveConversations(); renderConvList();
  }

  function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    const now = new Date();
    if (d.toDateString() === now.toDateString())
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  // ── Render ──
  function renderMessages() {
    messagesEl.innerHTML = '';
    if (!conversationHistory.length) {
      messagesEl.appendChild(welcomeEl);
      welcomeEl.style.display = 'flex';
      return;
    }
    welcomeEl.style.display = 'none';
    for (const msg of conversationHistory) {
      if (msg.role === 'user') appendUserBubble(msg.content);
      else if (msg.role === 'assistant' && typeof msg.content === 'string') appendAssistantBubble(msg.content);
    }
    scrollDown();
  }

  function appendUserBubble(text) {
    const div = document.createElement('div');
    div.className = 'msg user';
    div.innerHTML = `<div class="msg-bubble">${escapeHtml(text)}</div>`;
    messagesEl.appendChild(div);
  }

  function appendAssistantBubble(text) {
    const div = document.createElement('div');
    div.className = 'msg assistant';
    div.innerHTML = `<div class="msg-body">${renderMarkdown(text)}</div>`;
    messagesEl.appendChild(div);
    div.querySelectorAll('pre code:not(.hljs)').forEach(b => hljs.highlightElement(b));
  }

  function appendAssistantMessage(text) {
    welcomeEl.style.display = 'none';
    appendAssistantBubble(text);
    conversationHistory.push({ role: 'assistant', content: text });
    updateCurrentConv(conversationHistory);
    scrollDown();
  }

  // ── Workspace ──
  let workspace = localStorage.getItem('claude-workspace') || '';

  function updateWorkspaceDisplay() {
    const display = workspace || '未设置';
    $('workspacePath').textContent = display;
    statusWorkspace.textContent = display === '未设置' ? '未设置工作区' : display.split(/[\\/]/).pop();
  }
  updateWorkspaceDisplay();

  async function refreshFileTree() {
    if (!workspace) return;
    try {
      const res = await fetch('/api/workspace/files?path=' + encodeURIComponent(workspace));
      if (!res.ok) return;
      const files = await res.json();
      fileTreeEl.innerHTML = files.slice(0, 50).map(f =>
        `<div class="file-item ${f.type === 'dir' ? 'dir' : 'file'}" data-path="${f.path}" data-type="${f.type}">
          <span class="fi">${f.type === 'dir' ? '📁' : '📄'}</span>
          <span>${escapeHtml(f.name)}</span>
        </div>`
      ).join('');

      fileTreeEl.querySelectorAll('.file-item.dir').forEach(el => {
        el.addEventListener('click', () => sendAsUser('列出 ' + el.dataset.path + ' 下的文件'));
      });
      fileTreeEl.querySelectorAll('.file-item.file').forEach(el => {
        el.addEventListener('click', () => sendAsUser('读取 ' + el.dataset.path));
      });
    } catch(e) {}
  }

  if (typeof window !== 'undefined' && window.process && window.process.type) {
    const { ipcRenderer } = require('electron');
    $('changeWorkspaceBtn').addEventListener('click', async () => {
      const dir = await ipcRenderer.invoke('select-directory', workspace);
      if (dir) setWorkspace(dir);
    });
    $('titlebar').style.display = 'block';
    $('btnClose').addEventListener('click', () => ipcRenderer.send('window-close'));
    $('btnMinimize').addEventListener('click', () => ipcRenderer.send('window-minimize'));
    $('btnMaximize').addEventListener('click', () => ipcRenderer.send('window-maximize'));
    $('menuBtn').style.display = 'none';
  } else {
    $('changeWorkspaceBtn').addEventListener('click', () => $('workspacePicker').click());
    $('workspacePicker').addEventListener('change', () => {
      if ($('workspacePicker').files.length > 0) {
        const file = $('workspacePicker').files[0];
        const dir = file.webkitRelativePath.split('/')[0];
        const fullPath = file.path ? file.path.replace(/[\\/][^\\/]+$/, '') : dir;
        setWorkspace(fullPath);
      }
    });
  }

  function setWorkspace(dir) {
    workspace = dir;
    localStorage.setItem('claude-workspace', workspace);
    updateWorkspaceDisplay(); refreshFileTree();
    fetch('/api/workspace', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path: workspace }),
    });
  }

  // ── Export ──
  function exportConversation() {
    if (!conversationHistory.length) {
      appendAssistantMessage('没有可导出的对话。');
      return;
    }
    let md = `# ${headerTitle.textContent}\n\n`;
    md += `*导出于 ${new Date().toLocaleString()}*\n\n---\n\n`;
    for (const msg of conversationHistory) {
      if (msg.role === 'user') md += `## 用户\n\n${msg.content}\n\n`;
      else if (msg.role === 'assistant') md += `## 助手\n\n${msg.content}\n\n`;
    }
    const blob = new Blob([md], { type: 'text/markdown' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `claude-对话-${Date.now()}.md`;
    a.click();
    URL.revokeObjectURL(a.href);
    appendAssistantMessage('对话已导出为 Markdown 文件。');
  }

  // ── Settings ──
  function updateModelDisplay() {
    const model = apiConfig.model || 'claude-sonnet-4-20250514';
    const map = {
      'claude-sonnet-4-20250514': 'sonnet-4',
      'claude-opus-4-20250514': 'opus-4',
      'claude-haiku-4-5-20251001': 'haiku-4.5',
    };
    headerModel.textContent = map[model] || model.replace('claude-', '').replace(/-\d{8}$/, '');
  }
  updateModelDisplay();

  // Proxy presets
  proxyPresets.querySelectorAll('.proxy-preset').forEach(el => {
    el.addEventListener('click', () => {
      proxyPresets.querySelectorAll('.proxy-preset').forEach(p => p.classList.remove('active'));
      el.classList.add('active');
      baseURLInput.value = el.dataset.url;
    });
  });

  // Model select
  modelSelect.addEventListener('change', () => {
    if (modelSelect.value === 'custom') {
      modelInput.style.display = 'block';
      modelInput.focus();
    } else {
      modelInput.style.display = 'none';
      modelInput.value = '';
    }
  });

  $('settingsBtn').addEventListener('click', () => {
    $('systemPrompt').value = systemPrompt;
    $('apiKeyInput').value = apiConfig.apiKey || '';
    baseURLInput.value = apiConfig.baseURL || '';
    // Set model select
    const model = apiConfig.model || '';
    const opt = modelSelect.querySelector(`option[value="${model}"]`);
    if (opt) {
      modelSelect.value = model;
      modelInput.style.display = 'none';
    } else if (model) {
      modelSelect.value = 'custom';
      modelInput.value = model;
      modelInput.style.display = 'block';
    } else {
      modelSelect.value = 'claude-sonnet-4-20250514';
      modelInput.style.display = 'none';
    }
    // Highlight active proxy preset
    proxyPresets.querySelectorAll('.proxy-preset').forEach(p => {
      p.classList.toggle('active', p.dataset.url === baseURLInput.value);
    });
    $('settingsModal').classList.add('open');
  });
  $('modalClose').addEventListener('click', () => $('settingsModal').classList.remove('open'));
  $('settingsModal').addEventListener('click', e => { if (e.target === $('settingsModal')) $('settingsModal').classList.remove('open'); });
  $('modalSave').addEventListener('click', () => {
    systemPrompt = $('systemPrompt').value;
    localStorage.setItem('claude-system-prompt', systemPrompt);
    const model = modelSelect.value === 'custom' ? modelInput.value.trim() : modelSelect.value;
    apiConfig = {
      apiKey: $('apiKeyInput').value.trim(),
      baseURL: baseURLInput.value.trim() || undefined,
      model: model || undefined,
    };
    localStorage.setItem('claude-api-config', JSON.stringify(apiConfig));
    updateModelDisplay();
    $('settingsModal').classList.remove('open');
  });

  // ── Input ──
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 180) + 'px';
    sendBtn.disabled = !userInput.value.trim();

    const val = userInput.value;
    if (val.startsWith('/') && !val.includes(' ')) showSlashDropdown(val);
    else hideSlashDropdown();
  });

  userInput.addEventListener('keydown', e => {
    if (slashDropdown.classList.contains('open')) {
      const items = slashDropdown.querySelectorAll('.slash-item');
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        slashIndex = Math.min(slashIndex + 1, items.length - 1);
        items.forEach((it, i) => it.classList.toggle('active', i === slashIndex));
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        slashIndex = Math.max(slashIndex - 1, 0);
        items.forEach((it, i) => it.classList.toggle('active', i === slashIndex));
        return;
      }
      if (e.key === 'Tab' || (e.key === 'Enter' && !e.shiftKey)) {
        const active = items[slashIndex];
        if (active) {
          e.preventDefault();
          const cmd = active.dataset.cmd;
          const sc = slashCommands.find(c => c.cmd === cmd);
          hideSlashDropdown();
          if (sc && ['/clear','/export','/help','/analyze','/git-status','/git-log','/git-diff','/deps','/test','/browse'].includes(sc.cmd)) {
            userInput.value = '';
            sc.handler();
          } else {
            userInput.value = cmd + ' ';
            userInput.focus();
          }
          userInput.dispatchEvent(new Event('input'));
          return;
        }
      }
      if (e.key === 'Escape') { hideSlashDropdown(); return; }
    }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  sendBtn.addEventListener('click', sendMessage);

  document.querySelectorAll('.chip').forEach(el => {
    el.addEventListener('click', () => {
      const prompt = el.dataset.prompt;
      userInput.value = prompt;
      userInput.focus(); userInput.dispatchEvent(new Event('input'));
      if (prompt.startsWith('/')) {
        const parts = prompt.split(' ');
        const sc = slashCommands.find(c => c.cmd === parts[0]);
        if (sc && ['/browse','/analyze','/git-status','/git-log','/git-diff','/deps','/test'].includes(sc.cmd)) {
          userInput.value = '';
          sc.handler();
        }
      }
    });
  });

  $('btnNewChat').addEventListener('click', newConversation);
  $('clearBtn').addEventListener('click', newConversation);
  $('exportBtn').addEventListener('click', exportConversation);

  function updateStatus() {
    const count = conversationHistory.filter(m => m.role === 'user').length;
    statusMessages.textContent = count + ' 条消息';
  }

  // ── Markdown ──
  function renderMarkdown(text) {
    let h = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    h = h.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
      const hl = lang && hljs.getLanguage(lang) ? hljs.highlight(code.trim(), { language: lang }).value : hljs.highlightAuto(code.trim()).value;
      return `<pre><code class="hljs language-${lang||'auto'}">${hl}</code><button class="code-copy" onclick="copyCode(this)">复制</button></pre>`;
    });
    h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
    h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/(?<!\*)\*(?!\*)(.+?)(?<!\*)\*(?!\*)/g, '<em>$1</em>');
    h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>');
    h = h.replace(/^## (.+)$/gm, '<h2>$1</h2>');
    h = h.replace(/^# (.+)$/gm, '<h1>$1</h1>');
    h = h.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
    h = h.replace(/^[*\-] (.+)$/gm, '<li>$1</li>');
    h = h.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
    h = h.replace(/^---$/gm, '<hr>');
    h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    h = h.replace(/\n\n/g, '</p><p>');
    h = '<p>' + h + '</p>';
    h = h.replace(/(?<!<\/pre>)\n(?!<)/g, '<br>');
    h = h.replace(/<p>\s*<\/p>/g, '');
    return h;
  }

  window.copyCode = btn => { navigator.clipboard.writeText(btn.previousElementSibling.textContent); btn.textContent = '已复制'; setTimeout(() => btn.textContent = '复制', 1200); };

  // ── Tool Card ──
  function createToolCard(name, input) {
    const badges = { read_file: 'read', write_file: 'write', list_files: 'list', run_command: 'run', search_files: 'search' };
    const labels = { read_file: '读取', write_file: '写入', list_files: '目录', run_command: '执行', search_files: '搜索' };
    const inputStr = Object.entries(input).map(([k,v]) => {
      const val = typeof v === 'string' && v.length > 60 ? v.slice(0,60)+'...' : v;
      return `<code>${k}: ${val}</code>`;
    }).join(' ');

    const div = document.createElement('div');
    div.className = 'tool-card';
    div.innerHTML = `
      <div class="tool-header" onclick="this.parentElement.classList.toggle('open')">
        <span class="tool-badge ${badges[name]||'read'}">${labels[name]||name}</span>
        <span class="tool-name">${name}</span>
        <span class="tool-status running"><span class="dot"></span>运行中</span>
        <span class="tool-arrow">▼</span>
      </div>
      <div class="tool-input-line">${inputStr}</div>
      <div class="tool-detail"><pre><code>等待结果...</code></pre></div>
    `;
    return div;
  }

  function setToolResult(card, result) {
    const status = card.querySelector('.tool-status');
    status.className = 'tool-status done';
    status.innerHTML = '✓ 完成';
    const code = card.querySelector('.tool-detail code');
    code.textContent = result;
    if (typeof hljs !== 'undefined') hljs.highlightElement(code);
  }

  // ── Send ──
  function sendAsUser(text) {
    userInput.value = text;
    sendMessage();
  }

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isStreaming) return;

    if (text.startsWith('/')) {
      const parts = text.split(/\s+/);
      const sc = slashCommands.find(c => c.cmd === parts[0]);
      if (sc) {
        userInput.value = ''; userInput.style.height = 'auto';
        sendBtn.disabled = true; hideSlashDropdown();
        sc.handler(parts.slice(1).join(' '));
        return;
      }
    }

    welcomeEl.style.display = 'none';
    conversationHistory.push({ role: 'user', content: text });

    if (conversationHistory.filter(m => m.role === 'user').length === 1) {
      const title = text.length > 40 ? text.slice(0, 40) + '...' : text;
      updateCurrentConv(conversationHistory, title);
      headerTitle.textContent = title;
    }

    appendUserBubble(text);

    userInput.value = ''; userInput.style.height = 'auto';
    sendBtn.disabled = true; hideSlashDropdown();
    isStreaming = true;

    const assistantDiv = document.createElement('div');
    assistantDiv.className = 'msg assistant';
    assistantDiv.innerHTML = `<div class="msg-body"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
    messagesEl.appendChild(assistantDiv);

    const bodyEl = assistantDiv.querySelector('.msg-body');
    let fullText = '', toolContainer = null;

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: conversationHistory, system: systemPrompt, config: apiConfig, workspace }),
      });

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          try {
            const data = JSON.parse(line.slice(6));
            if (data.type === 'text') {
              fullText += data.text;
              bodyEl.innerHTML = renderMarkdown(fullText);
              bodyEl.querySelectorAll('pre code:not(.hljs)').forEach(b => hljs.highlightElement(b));
              scrollDown();
            } else if (data.type === 'tool_use') {
              if (!toolContainer) { toolContainer = document.createElement('div'); bodyEl.appendChild(toolContainer); }
              const card = createToolCard(data.name, data.input);
              card.dataset.toolId = data.id;
              toolContainer.appendChild(card);
              scrollDown();
            } else if (data.type === 'tool_result') {
              const card = bodyEl.querySelector(`.tool-card[data-tool-id="${data.id}"]`);
              if (card) setToolResult(card, data.result);
              fullText = ''; toolContainer = null;
              scrollDown();
            } else if (data.type === 'error') {
              bodyEl.innerHTML += `<div class="msg-error">${data.error}</div>`;
            }
          } catch(e) {}
        }
      }
      conversationHistory.push({ role: 'assistant', content: fullText });
      updateCurrentConv(conversationHistory);
    } catch (error) {
      bodyEl.innerHTML += `<div class="msg-error">请求失败: ${error.message}</div>`;
    } finally {
      isStreaming = false;
      sendBtn.disabled = !userInput.value.trim();
      userInput.focus();
      updateStatus();
    }
  }

  function escapeHtml(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }
  function scrollDown() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  // ── Init ──
  if (conversations.length) loadConversation(conversations[0].id);
  else newConversation();
  refreshFileTree();
  userInput.focus();
})();
</script>
